name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install toolchain
        run: npm install -g @icp-sdk/icp-cli@1.9.0 @icp-sdk/ic-wasm ic-mops@3.4.2

      - name: Install packages
        run: mops install

      - name: Build
        run: icp build

      - name: Test
        run: mops test

      # Published so anyone can compare them with the module hashes of deployed canisters.
      - name: Module hashes
        run: |
          # icp-cli stores each wasm by its hash; .refs/<name> names the hash of that canister's build.
          artifacts=.icp/cache/artifacts
          for ref in "$artifacts"/.refs/*; do
            wasm="$artifacts/.modules/$(cat "$ref").wasm"
            echo "$(basename "$ref") $(shasum -a 256 "$wasm" | cut -d' ' -f1)"
          done | tee -a "$GITHUB_STEP_SUMMARY"
